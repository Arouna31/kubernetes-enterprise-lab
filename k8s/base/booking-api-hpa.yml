apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: booking-api
  namespace: booking-dev

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-api

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60 # 60 % of request CPU declared on request resources
