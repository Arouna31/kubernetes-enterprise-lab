spring:
  application:
    name: booking-api

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  environment: ${APP_ENVIRONMENT:local}
  version: ${APP_VERSION:1.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
